<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Sentinal — product film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#000}a{color:#8C9EFF}a:hover{color:#F2F2F0}</style>
<script>window.OM_SCENES = '[{"name":"Terminal","dur":8,"desc":"Jobs start in four terminals across machines; You start it. You walk away."},{"name":"Login","dur":4,"desc":"The Sentinal mark draws, Welcome back and the password fills in"},{"name":"Running","dur":10,"desc":"01 What am I running? Overview builds, needs-you cards rise to the top, cursor opens Qwen Training"},{"name":"Going","dur":10,"desc":"02 How is it going? Session detail: progress, loss, GPU, events and the evidence-based health card"},{"name":"Reach","dur":12,"desc":"03 Can I reach it? Phone notification, answer y, then four terminals side by side"},{"name":"History","dur":9,"desc":"04 How did I run this last time? Light theme: history search for python, then the vLLM recipe resolves and runs"},{"name":"End","dur":7,"desc":"Sentinal mark, tagline, Coming soon and github.com/SentinalResearch, then fade to black"}]';</script>
<script>window.OM_PLAYBACK = '{"mode":"loop"}';</script>
</helmet>
<div style="position:fixed; inset:0; background:#000">
<x-import component-from-global-scope="SentinalFilm" from="./animations-v3.jsx ./sentinal-film.jsx" format="{{ format }}" hint-size="100%,100%" style="position:absolute; inset:0"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;format&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;16:9&quot;,&quot;1:1&quot;,&quot;9:16&quot;],&quot;default&quot;:&quot;16:9&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;motionEditor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() { return { format: this.props.format ?? '16:9' }; }
}
</script>
</body>
</html>
