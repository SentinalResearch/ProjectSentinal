[package]
name = "cli"
description = "Sentinal command-line client (sentinal)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
futures-util.workspace = true
protocol = { path = "../protocol" }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true

[dev-dependencies]
# Drives the CLI inside a real pseudo-terminal in the ignored watch_integration.
portable-pty.workspace = true
# Paused clock for deterministic 50 ms deadline tests (no real sleeps).
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "sentinal"
path = "src/bin/sentinal.rs"

# Compatibility alias through the Milestone 1b migration.
[[bin]]
name = "ta"
path = "src/bin/ta.rs"

[lints]
workspace = true
