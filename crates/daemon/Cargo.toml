[package]
name = "daemon"
description = "Sentinal daemon (sentinald): persistent, observable terminal Sessions."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
nvidia = ["dep:nvml-wrapper"]

[dependencies]
argon2.workspace = true
axum.workspace = true
futures-util.workspace = true
portable-pty.workspace = true
protocol = { path = "../protocol" }
store = { path = "../store" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vt100.workspace = true
zstd.workspace = true
sysinfo.workspace = true
nvml-wrapper = { workspace = true, optional = true }

[dev-dependencies]
tower.workspace = true

[[bin]]
name = "sentinald"
path = "src/bin/sentinald.rs"

# Compatibility alias through the Milestone 1b migration; existing service
# units still start `tad`.
[[bin]]
name = "tad"
path = "src/bin/tad.rs"

[lints]
workspace = true
