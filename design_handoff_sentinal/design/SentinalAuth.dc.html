<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative; height:100vh; overflow:{{ rootOverflow }}; display:flex; flex-direction:column; background:var(--bg-0); color:var(--text-1)">
<div aria-hidden="true" style="position:absolute; inset:0; pointer-events:none; background-image:radial-gradient(circle, var(--line-strong) 1px, transparent 1.4px); background-size:24px 24px; opacity:.28; -webkit-mask-image:radial-gradient(ellipse 50% 55% at 50% 42%, #000 0%, transparent 100%); mask-image:radial-gradient(ellipse 50% 55% at 50% 42%, #000 0%, transparent 100%)"></div>
<header style="position:relative; display:flex; justify-content:space-between; align-items:center; height:64px; padding:0 28px">
<button onClick="{{ toLanding }}" style="height:36px; padding:0 10px; border:0; background:transparent; color:var(--text-2); font-size:13px; font-weight:600" style-hover="color:var(--text-1)">← Home</button>
<button onClick="{{ toggleTheme }}" style="height:36px; padding:0 10px; border:0; background:transparent; color:var(--text-2); font-size:13px; font-weight:600" style-hover="color:var(--text-1)">{{ themeLabel }}</button>
</header>
<main style="position:relative; flex:1; display:flex; align-items:center; justify-content:center; padding:16px 24px 56px">
<div style="width:100%; max-width:880px; display:flex; flex-wrap:wrap; align-items:center; gap:40px 0">
<div style="flex:1 1 340px; min-width:0; display:flex; flex-direction:column; gap:28px; padding-right:48px">
<div style="height:88px; display:flex; align-items:center">{{ markEl }}</div>
<div style="display:flex; flex-direction:column; gap:10px">
<span style="font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:0.04em; color:{{ overColor }}">{{ overTyped }}</span>
<h1 aria-label="{{ title }}" style="margin:0; min-height:96px; font-size:48px; line-height:48px; font-weight:800; letter-spacing:-0.04em; text-wrap:balance">{{ titleTyped }}<span class="tg-motion" style="display:inline-block; width:0.42em; height:0.78em; margin-left:4px; vertical-align:-0.04em; background:var(--accent); animation:sn-blink 1s step-end infinite"></span></h1>
<p style="margin:0; font-size:15px; line-height:22px; color:var(--text-2); text-wrap:pretty; opacity:{{ bodyOp }}; transition:opacity .4s">{{ body }}</p>
</div>
</div>
<div style="flex:1 1 340px; min-width:0; display:flex; flex-direction:column; gap:24px; padding-left:48px; border-left:1px solid var(--line)">


<sc-if value="{{ isSetup }}">
<form onSubmit="{{ submitSetup }}" style="display:flex; flex-direction:column; gap:16px">
<label style="display:flex; flex-direction:column; gap:6px"><span style="font-size:13px; font-weight:600">New password</span><input type="password" value="{{ pw }}" onChange="{{ onPw }}" autofocus="{{ true }}" autocomplete="new-password" style="height:48px; padding:0 12px; border:1px solid var(--line-strong); background:transparent; color:var(--text-1); font-size:15px"></input></label>
<label style="display:flex; flex-direction:column; gap:6px"><span style="font-size:13px; font-weight:600">Confirm password</span><input type="password" value="{{ pw2 }}" onChange="{{ onPw2 }}" autocomplete="new-password" style="height:48px; padding:0 12px; border:1px solid var(--line-strong); background:transparent; color:var(--text-1); font-size:15px"></input></label>
<div style="display:flex; flex-direction:column; gap:4px; font-size:13px">
<span style="display:flex; gap:8px; color:{{ r1c }}"><span style="width:14px">{{ r1 }}</span>At least 12 characters</span>
<span style="display:flex; gap:8px; color:{{ r2c }}"><span style="width:14px">{{ r2 }}</span>Both fields match</span>
</div>
<button type="submit" disabled="{{ setupDisabled }}" style="height:48px; border:0; background:{{ setupBg }}; color:{{ setupFg }}; font-size:15px; font-weight:700">Create password and continue</button>
</form>
</sc-if>

<sc-if value="{{ isPwForm }}">
<form onSubmit="{{ submitLogin }}" style="display:flex; flex-direction:column; gap:16px">
<sc-if value="{{ isExpired }}"><div style="display:flex; justify-content:space-between; padding:10px 12px; background:var(--bg-1); font-size:13px"><span style="color:var(--text-2)">Returning to</span><span style="font-weight:700">Overview</span></div></sc-if>
<label style="display:flex; flex-direction:column; gap:6px">
<span style="display:flex; justify-content:space-between; font-size:13px; font-weight:600"><span>Password</span><button type="button" onClick="{{ toggleShow }}" style="border:0; background:transparent; padding:0; color:var(--text-3); font-size:12px; font-weight:600">{{ showLabel }}</button></span>
<span style="position:relative; display:flex"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="position:absolute; left:14px; top:16px; color:var(--text-3); pointer-events:none"><rect x="3" y="7" width="10" height="7"></rect><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path></svg><input type="{{ pwType }}" value="{{ pw }}" onChange="{{ onPw }}" disabled="{{ isLocked }}" autofocus="{{ true }}" autocomplete="current-password" placeholder="{{ placeholder }}" style="flex:1; min-width:0; height:48px; padding:0 14px 0 40px; border:1px solid {{ fieldBorder }}; background:{{ fieldBg }}; color:var(--text-1); font-size:15px; letter-spacing:0.08em"></input></span>
<sc-if value="{{ hasError }}"><span style="font-size:13px; color:var(--s-failed-fg); font-weight:600">{{ error }}</span></sc-if>
</label>
<sc-if value="{{ isLocked }}"><div style="display:flex; align-items:baseline; justify-content:space-between; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line)"><span style="font-size:13px; color:var(--text-2)">Try again in</span><span style="font-size:32px; line-height:32px; font-weight:800; letter-spacing:-0.02em">{{ lockClock }}</span></div></sc-if>
<button type="submit" disabled="{{ isLocked }}" style="height:48px; padding:0 16px; border:0; background:{{ loginBg }}; color:{{ loginFg }}; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:space-between" style-hover="filter:brightness(1.08)"><span>{{ signLabel }}</span><span style="font-family:'JetBrains Mono',monospace; font-size:13px; opacity:.75">↵</span></button>
</form>
</sc-if>
<span style="font-size:12px; line-height:17px; color:var(--text-3); text-wrap:pretty">{{ foot }}</span>
</div>
</div>
</main>
<footer style="position:relative; display:flex; align-items:center; justify-content:center; gap:4px; flex-wrap:wrap; padding:14px 32px; border-top:1px solid var(--line); background:var(--bg-0); font-size:12px; color:var(--text-3)">
<span style="margin-right:8px; font-weight:700; letter-spacing:0.06em">PROTOTYPE STATES</span>
<sc-for list="{{ modes }}" as="m" hint-placeholder-count="5">
<button onClick="{{ m.pick }}" style="height:28px; padding:0 10px; border:1px solid {{ m.bd }}; background:transparent; color:{{ m.fg }}; font-size:12px; font-weight:600">{{ m.label }}</button>
</sc-for>
<span style="margin-left:12px">Any password of 8+ characters signs in. Shorter ones fail.</span>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { n: 0, pw: '', pw2: '', show: false, attempts: 0, lock: 300, busy: false, ok: false, shake: 0 };
  componentDidMount() { this.type(); this.tick = setInterval(() => { if (this.props.mode === 'locked') this.setState(s => { if (s.lock <= 1) { this.props.setMode && this.props.setMode('login'); return { lock: 300, attempts: 0 }; } return { lock: s.lock - 1 }; }); }, 1000); }
  componentWillUnmount() { clearInterval(this.tick); clearTimeout(this.t1); clearTimeout(this.t2); clearInterval(this.ty); }
  finish() { this.setState({ busy: false, ok: true }); this.t2 = setTimeout(() => { this.setState({ ok: false, pw: '', pw2: '', attempts: 0 }); this.props.onLogin && this.props.onLogin(); }, 520); }
  mark(mode) {
    const e = React.createElement, s = this.state;
    const dot = (mode === 'wrong' || mode === 'locked') ? 'var(--s-failed)' : mode === 'expired' ? 'var(--s-waiting)' : 'var(--accent)';
    const pulse = !s.busy && !s.ok && mode !== 'locked';
    return e('div', { key: 'm' + s.shake, className: 'tg-motion', style: { width: 88, height: 88, animation: s.shake ? 'sn-shake .42s ease' : 'none' } },
      e('svg', { viewBox: '0 0 24 24', width: 88, height: 88, style: { display: 'block', overflow: 'visible' }, 'aria-label': 'Sentinal' },
        e('path', { key: s.busy ? 'scan' : 'draw', className: 'tg-motion', d: 'M5 22L13.5 2', pathLength: 1, fill: 'none', stroke: 'var(--text-1)', strokeWidth: 3.4, strokeLinecap: 'square',
          style: s.busy ? { strokeDasharray: '0.35 0.65', animation: 'sn-scan .8s linear infinite' } : { strokeDasharray: '1', animation: 'sn-draw .7s cubic-bezier(.6,0,.2,1) both' } }),
        e('circle', { className: 'tg-motion', cx: 18, cy: 18.5, r: 3.4, fill: 'none', stroke: dot, strokeWidth: 1.2, style: { transformOrigin: '18px 18.5px', opacity: pulse ? 1 : 0, animation: pulse ? 'sn-ping 2.4s ease-out 1.1s infinite' : 'none' } }),
        e('circle', { className: 'tg-motion', cx: 18, cy: 18.5, r: 3.4, fill: dot, style: { transformOrigin: '18px 18.5px', transition: 'fill .25s', animation: s.ok ? 'sn-grow .55s cubic-bezier(.7,0,.3,1) forwards' : 'sn-pop .45s .5s cubic-bezier(.3,1.6,.5,1) both' } })));
  }
  componentDidUpdate(pp) { if (pp.mode !== this.props.mode) { this.setState({ pw: '', pw2: '' }); if (!(pp.mode === 'login' && this.props.mode === 'wrong') && !(pp.mode === 'wrong' && this.props.mode === 'login')) this.type(); } }
  type() { clearInterval(this.ty); this.setState({ n: 0 }); const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; if (reduce) return this.setState({ n: 999 });
    this.ty = setInterval(() => this.setState(s => { if (s.n >= 120) { clearInterval(this.ty); return null; } return { n: s.n + 1 }; }), 45); }
  renderVals() {
    const mode = this.props.mode || 'login';
    const setMode = this.props.setMode || (() => {});
    const s = this.state;
    const copy = {
      login: ['SIGN IN', 'Welcome back', 'Enter the admin password for this Sentinal server.', 'var(--text-3)'],
      wrong: ['SIGN IN', 'Welcome back', 'Enter the admin password for this Sentinal server.', 'var(--text-3)'],
      locked: ['LOCKED', 'Too many attempts', 'Sign-in is paused after 3 incorrect passwords. Your sessions keep running.', 'var(--s-failed-fg)'],
      expired: ['SESSION EXPIRED', 'Sign in again', 'Your sign-in on this browser expired. Your sessions kept running.', 'var(--s-waiting-fg)'],
      setup: ['FIRST RUN', 'Create the admin password', 'This server has no password yet. Sentinal has one account: yours. You’ll use this password on every device.', 'var(--accent-fg)']
    }[mode];
    const left = 3 - Math.max(mode === 'wrong' ? 1 : 0, s.attempts);
    const hasError = mode === 'wrong';
    const r1 = s.pw.length >= 12, r2 = s.pw.length > 0 && s.pw === s.pw2;
    const locked = mode === 'locked';
    const mm = String(Math.floor(s.lock / 60)).padStart(2, '0'), ss = String(s.lock % 60).padStart(2, '0');
    const labels = [['login','Login'],['setup','First run'],['wrong','Wrong password'],['locked','Locked'],['expired','Expired']];
    return {
      toLanding: () => this.props.go && this.props.go('landing'), markEl: this.mark(mode), rootOverflow: s.ok ? 'hidden' : 'auto', signLabel: s.busy ? 'Checking…' : 'Sign in', toggleTheme: this.props.toggleTheme,
      themeLabel: this.props.theme === 'light' ? 'Dark theme' : 'Light theme',
      over: copy[0], title: copy[1], body: copy[2], overColor: copy[3],
      overTyped: '> ' + copy[0].toLowerCase().slice(0, Math.max(0, s.n)), titleTyped: copy[1].slice(0, Math.max(0, s.n - copy[0].length - 2)),
      bodyOp: s.n >= copy[0].length + copy[1].length + 2 ? 1 : 0,
      isSetup: mode === 'setup', isPwForm: mode !== 'setup', isExpired: mode === 'expired', isLocked: locked,
      pw: s.pw, pw2: s.pw2, onPw: e => this.setState({ pw: e.target.value }), onPw2: e => this.setState({ pw2: e.target.value }),
      pwType: s.show ? 'text' : 'password', showLabel: s.show ? 'Hide' : 'Show', toggleShow: () => this.setState({ show: !s.show }),
      placeholder: locked ? 'Locked' : '',
      hasError, error: `Incorrect password. ${left} ${left === 1 ? 'attempt' : 'attempts'} left before a 5-minute lock.`,
      fieldBorder: hasError ? 'var(--s-failed-fg)' : 'var(--line-strong)', fieldBg: locked ? 'var(--bg-1)' : 'transparent',
      lockClock: `${mm}:${ss}`,
      loginBg: locked || s.busy ? 'var(--bg-2)' : 'var(--accent)', loginFg: locked ? 'var(--text-3)' : s.busy ? 'var(--text-1)' : 'var(--on-accent)',
      submitLogin: e => { e.preventDefault(); if (locked || s.busy || s.ok) return;
        this.setState({ busy: true });
        this.t1 = setTimeout(() => {
          if (this.state.pw.length >= 8) return this.finish();
          const a = this.state.attempts + 1; this.setState(x => ({ busy: false, attempts: a, pw: '', shake: x.shake + 1 }));
          if (a >= 3) { this.setState({ lock: 300 }); setMode('locked'); } else setMode('wrong'); }, 750); },
      r1: r1 ? '✓' : '·', r2: r2 ? '✓' : '·', r1c: r1 ? 'var(--s-running-fg)' : 'var(--text-3)', r2c: r2 ? 'var(--s-running-fg)' : 'var(--text-3)',
      setupDisabled: !(r1 && r2), setupBg: (r1 && r2) ? 'var(--accent)' : 'var(--bg-2)', setupFg: (r1 && r2) ? 'var(--on-accent)' : 'var(--text-3)',
      submitSetup: e => { e.preventDefault(); if (r1 && r2 && !s.ok) { this.setState({ busy: true }); this.t1 = setTimeout(() => this.finish(), 750); } },
      foot: mode === 'setup' ? 'Stored as a salted hash on this server. There is no reset email; recovery is a CLI command on the host.' : 'Signed-in browsers stay signed in until you sign out or the session expires.',
      modes: labels.map(([k, label]) => ({ label, pick: () => { if (k === 'wrong') this.setState({ attempts: 1 }); if (k === 'locked') this.setState({ lock: 300 }); setMode(k); },
        bd: k === mode ? 'var(--text-1)' : 'var(--line)', fg: k === mode ? 'var(--text-1)' : 'var(--text-3)' }))
    };
  }
}
</script>
</body>
</html>
