<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="max-width:1200px; padding:40px 48px 80px; display:flex; flex-direction:column; gap:40px; animation:sn-in .25s ease-out">
<header style="display:flex; flex-direction:column; gap:8px; border-bottom:2px solid var(--text-1); padding-bottom:20px">
<span style="font-size:11px; font-weight:700; letter-spacing:0.08em; color:var(--text-3)">PROJECT</span>
<h1 style="margin:0; font-size:56px; line-height:56px; font-weight:800; letter-spacing:-0.045em">{{ p.name }}</h1>
<div style="display:flex; gap:20px; flex-wrap:wrap; font-size:14px; color:var(--text-2)"><span style="font-family:'JetBrains Mono',monospace; font-size:13px">{{ p.path }}</span><span>{{ p.summary }}</span></div>
</header>
<div style="display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:40px; align-items:start">
<div style="display:flex; flex-direction:column; gap:40px; min-width:0">
<section style="display:flex; flex-direction:column">
<div style="display:flex; justify-content:space-between; padding-bottom:8px; border-bottom:1px solid var(--text-1)"><span style="font-size:16px; font-weight:800">Sessions</span><span style="font-size:13px; color:var(--text-3)">across machines</span></div>
<sc-for list="{{ p.sessions }}" as="s" hint-placeholder-count="2">
<div onClick="{{ s.open }}" style="display:grid; grid-template-columns:110px minmax(0,1fr) auto; gap:16px; align-items:center; min-height:60px; padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer" style-hover="background:var(--bg-1)">
<dc-import name="StateTag" state="{{ s.state }}" size="sm" hint-size="80px,20px"></dc-import>
<div style="display:flex; flex-direction:column; min-width:0"><span style="font-size:15px; font-weight:700">{{ s.name }}</span><span style="font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap">{{ s.cmd }}</span></div>
<div style="display:flex; flex-direction:column; align-items:flex-end"><span style="font-size:13px; font-weight:600">{{ s.fact }}</span><span style="font-size:12px; color:var(--text-3)">{{ s.machine }}</span></div>
</div>
</sc-for>
</section>
<section style="display:flex; flex-direction:column">
<div style="display:flex; justify-content:space-between; padding-bottom:8px; border-bottom:1px solid var(--text-1)"><span style="font-size:16px; font-weight:800">Command history</span><button onClick="{{ toHistory }}" style="border:0; background:transparent; padding:0; color:var(--accent-fg); font-size:13px; font-weight:600">Search all →</button></div>
<sc-for list="{{ p.history }}" as="h" hint-placeholder-count="3">
<div style="display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:14px; align-items:center; min-height:48px; border-bottom:1px solid var(--line)">
<dc-import name="StateTag" state="{{ h.s }}" size="sm" icon-only="{{ true }}" hint-size="24px,20px"></dc-import>
<span style="font-family:'JetBrains Mono',monospace; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">{{ h.cmd }}</span>
<span style="font-size:12px; color:var(--text-3)">{{ h.machine }}</span>
<span style="font-size:14px; font-weight:600; min-width:64px; text-align:right; color:{{ h.dc }}">{{ h.dur }}</span>
</div>
</sc-for>
</section>
</div>
<section style="display:flex; flex-direction:column">
<div style="display:flex; justify-content:space-between; padding-bottom:8px; border-bottom:1px solid var(--text-1)"><span style="font-size:16px; font-weight:800">Event journal</span><span style="font-size:13px; color:var(--text-3)">newest first</span></div>
<sc-for list="{{ p.events }}" as="e" hint-placeholder-count="6">
<div style="display:grid; grid-template-columns:40px 10px minmax(0,1fr); gap:8px; align-items:start; padding:9px 0; border-bottom:1px solid var(--line)">
<span style="font-family:'JetBrains Mono',monospace; font-size:12px; line-height:17px; color:var(--text-3)">{{ e.t }}</span>
<span style="width:8px; height:8px; margin-top:4px; background:{{ e.c }}"></span>
<span style="display:flex; flex-direction:column; min-width:0"><span style="display:flex; gap:8px; align-items:baseline"><span style="font-family:'JetBrains Mono',monospace; font-size:11px; line-height:17px; font-weight:700; color:{{ e.tc }}">{{ e.type }}</span><span style="font-size:11px; color:var(--text-3)">{{ e.who }}</span></span><span style="font-family:'JetBrains Mono',monospace; font-size:12px; line-height:17px; overflow-wrap:anywhere">{{ e.d }}</span></span>
</div>
</sc-for>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const go = this.props.go || (() => {});
    const id = (this.props.params || {}).id || 'tim';
    const open = sid => () => go('app/session', { id: sid });
    const C = { x:['var(--text-1)','var(--text-1)'], p:['var(--line-strong)','var(--text-2)'], i:['var(--accent-fg)','var(--accent-fg)'], w:['var(--s-waiting)','var(--s-waiting-fg)'], e:['var(--s-failed)','var(--s-failed-fg)'] };
    const ev = a => a.map(([t,type,d,k,who]) => ({ t, type, d, who, c:C[k][0], tc:C[k][1] })).reverse();
    const P = {
      tim: { name:'TIM', path:'~/Projects/TIM', summary:'2 sessions · RTX-PC',
        sessions:[{ id:'qwen', state:'running', name:'Qwen Training', cmd:'python train.py --config moe.yaml', fact:'68 % · 1h31m', machine:'RTX-PC' },{ id:'shell', state:'idle', name:'shell', cmd:'~/Projects/TIM', fact:'idle', machine:'RTX-PC' }],
        history:[{ s:'running', cmd:'python train.py --config moe.yaml', machine:'RTX-PC', dur:'running', dc:'var(--s-running-fg)' },{ s:'completed', cmd:'python benchmark.py', machine:'RTX-PC', dur:'18m', dc:'var(--text-1)' }],
        events: ev([['12:42','COMMAND_STARTED','python train.py --config moe.yaml','x','Qwen Training'],['12:44','PROGRESS','epoch 1/100','p','Qwen Training'],['13:41','CHECKPOINT_CREATED','ckpt/epoch_37.pt','i','Qwen Training'],['13:58','RESOURCE_HIGH','VRAM 96.5 %','w','Qwen Training'],['14:02','WARNING','VRAM usage high','w','Qwen Training'],['14:13','PROGRESS','epoch 68/100','p','Qwen Training']]) },
      maa: { name:'MentalAnimAItion', path:'~/Projects/MentalAnimAItion', summary:'1 session · RTX-PC',
        sessions:[{ id:'pytest', state:'failed', name:'pytest', cmd:'pytest tests/', fact:'3 failed · 42s', machine:'RTX-PC' }],
        history:[{ s:'failed', cmd:'pytest tests/', machine:'RTX-PC', dur:'42s', dc:'var(--s-failed-fg)' }],
        events: ev([['—','COMMAND_STARTED','pytest tests/','x','pytest'],['—','COMMAND_FAILED','3 failed · 182 passed · 42s','e','pytest']]) }
    };
    const p = P[id] || P.tim;
    return { p: { ...p, sessions: p.sessions.map(s => ({ ...s, open: open(s.id) })) }, toHistory: () => go('app/history', { project: id }) };
  }
}
</script>
</body>
</html>
