[workspace]
resolver = "2"
members = ["crates/protocol", "crates/store", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

# Shared dependency versions. Crates use `serde.workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
axum = { version = "0.8", features = ["ws"] }
argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
portable-pty = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
sysinfo = "0.37"
nvml-wrapper = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vt100 = "0.16"
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
