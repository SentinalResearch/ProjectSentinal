[workspace]
resolver = "2"
members = ["crates/protocol"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

# Shared dependency versions. Crates use `serde.workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
